name: Build Xiaomi SDM845 Kernels with OriginSU

# Based on Coconutat's SDM845 4.9 kernel (android_kernel_xiaomi_sdm845_lineageos_Exp),
# which already ships SuSFS v2.x and the SuSFS inline hooks. The branch is picked
# automatically: the most recent LineageOS version whose branch contains SuSFS
# (currently lineage-22.2-BakaSU).
# BakaSU (fetched by sync_ksu.sh, not part of the tree) is replaced by OriginSU.
# Build and packaging follow Coconutat's build_kernel.sh / sync_anykernel3.sh exactly;
# a manual "bakasu" run builds the untouched Coconutat kernel as a control.
#
# OriginSU is discontinued: the project became KazeSU (https://github.com/KazeSU/KazeSU).
# This builder is frozen on the last OriginSU release, v4.3.0, kept in the KazeSU repository
# (tag v4.3.0, GitHub release "legacy-v4.3.0"). KazeSU v1.x does not build on this 4.9 tree (its
# SELinux code needs the 5.10+ struct selinux_state; 4.9 has no struct selinux_state at all), so
# OriginSU v4.3.0 stays the recommended root. 4.9 is the newest kernel LineageOS ships for SDM845.
# Manual runs only.

on:
  workflow_dispatch:
    inputs:
      originsu_ref:
        description: "OriginSU tag to build (last OriginSU release: v4.3.0)"
        required: false
        default: "v4.3.0"
      kernel_branch:
        description: "Coconutat kernel branch (empty = latest LineageOS with SuSFS)"
        required: false
        default: ""
      root:
        description: "Root solution (bakasu = control build identical to Coconutat's, never published)"
        type: choice
        options: [originsu, bakasu]
        default: originsu
      kpm:
        description: "Enable CONFIG_KPM (experimental on 4.9)"
        type: boolean
        default: false
      publish:
        description: "Publish a GitHub Release"
        type: boolean
        default: true

concurrency:
  group: kernel-build
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  KERNEL_REPO: Coconutat/android_kernel_xiaomi_sdm845_lineageos_Exp
  KERNEL_DIR: android_kernel_xiaomi_sdm845
  # Toolchain used by Coconutat (see the kernel's README)
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-release/clang-r547379.tar.gz
  KBUILD_BUILD_USER: builder
  KBUILD_BUILD_HOST: github-actions

jobs:
  # ------------------------------------------------------------------
  # 1) What to build (manual runs only)
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      branch: ${{ steps.branch.outputs.branch }}
      lineage: ${{ steps.branch.outputs.lineage }}
      android: ${{ steps.branch.outputs.android }}
      build: ${{ steps.decide.outputs.build }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: OriginSU release (with its manager APK)
        id: ver
        run: |
          TAG="${{ inputs.originsu_ref }}"
          TAG="${TAG:-v4.3.0}"
          # OriginSU tags only (v4.x). samakshkambxj/OriginSU now redirects to KazeSU/KazeSU,
          # where KazeSU v1.x lives too: never pick its "latest" release.
          case "$TAG" in
            v4.*) ;;
            *) echo "::error::$TAG is not an OriginSU tag (expected v4.x, e.g. v4.3.0)"; exit 1 ;;
          esac

          # Only build when the matching manager is published in the release
          APKS=$(gh release view "$TAG" --repo KazeSU/KazeSU --json assets -q '.assets[].name' 2>/dev/null | grep -E '\.apk$' || true)
          if [ -z "$APKS" ]; then
            echo "::warning::OriginSU release $TAG does not contain the manager APK (yet) -> no build"
            echo "manager=false" >> "$GITHUB_OUTPUT"
          else
            echo "Manager available:"; echo "$APKS" | sed 's/^/  /'
            echo "manager=true" >> "$GITHUB_OUTPUT"
          fi
          echo "OriginSU version: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pick the most recent LineageOS kernel branch with SuSFS
        id: branch
        run: |
          R="$KERNEL_REPO"
          pick() {
            echo "branch=$1" >> "$GITHUB_OUTPUT"
            V=$(echo "$1" | sed -nE 's/^lineage-([0-9]+(\.[0-9]+)?).*/\1/p')
            [ -n "$V" ] || { echo "::error::Unexpected branch name: $1 (expected lineage-<version>...)"; exit 1; }
            echo "lineage=$V" >> "$GITHUB_OUTPUT"
            # LineageOS N = Android N-7 (21 -> 14, 22 -> 15, 23 -> 16)
            echo "android=$(( ${V%%.*} - 7 ))" >> "$GITHUB_OUTPUT"
            echo "Selected kernel branch: $1 (LineageOS $V)"
          }

          # Same file/hook list as the "Install the root solution" step: a branch is only
          # usable if it has SuSFS, the shared configs AND every inline hook OriginSU needs.
          # Read through the authenticated API (raw.githubusercontent.com can fail/rate-limit).
          getf() { gh api -H "Accept: application/vnd.github.raw" "repos/$R/contents/$1?ref=$2" 2>/dev/null; }
          usable() {
            local b=$1 f p c
            for f in fs/susfs.c include/linux/susfs.h \
                     arch/arm64/configs/vendor/xiaomi/mi845_defconfig \
                     arch/arm64/configs/vendor/xiaomi/extra.config; do
              gh api "repos/$R/contents/$f?ref=$b" -q .name >/dev/null 2>&1 || { echo "  $b: $f missing"; return 1; }
            done
            for p in "kernel/sys.c:ksu_handle_setresuid" "fs/exec.c:ksu_handle_execveat" \
                     "fs/open.c:ksu_handle_faccessat" "fs/read_write.c:ksu_handle_sys_read" \
                     "fs/stat.c:ksu_handle_stat" "kernel/reboot.c:ksu_handle_sys_reboot" \
                     "drivers/input/input.c:ksu_handle_input_handle_event"; do
              c=""
              for _ in 1 2 3; do c=$(getf "${p%%:*}" "$b") && [ -n "$c" ] && break; sleep 5; done
              [ -n "$c" ] || { echo "::warning::$b: could not read ${p%%:*}"; return 1; }
              grep -q "${p#*:}" <<<"$c" || { echo "  $b: hook ${p#*:} missing from ${p%%:*}"; return 1; }
            done
            echo "  $b: SuSFS + all hooks OK"
          }

          if [ -n "${{ inputs.kernel_branch }}" ]; then
            usable "${{ inputs.kernel_branch }}" \
              || { echo "::error::Branch ${{ inputs.kernel_branch }} lacks SuSFS or a required hook (see above)"; exit 1; }
            pick "${{ inputs.kernel_branch }}"; exit 0
          fi

          # lineage-<version>[-suffix] branches (e.g. lineage-22.2-BakaSU, lineage-23.0-...)
          BR=$(gh api --paginate "repos/$R/branches?per_page=100" -q '.[].name' \
               | grep -E '^lineage-[0-9]+(\.[0-9]+)?(-[A-Za-z0-9._-]+)?$')
          VERS=$(echo "$BR" | sed -E 's/^lineage-([0-9]+(\.[0-9]+)?).*/\1/' | sort -uVr)
          echo "Available LineageOS versions: $(echo $VERS)"

          for v in $VERS; do
            ve=${v//./\\.}
            # Same version: most recently updated branch first
            CANDS=$(for b in $(echo "$BR" | grep -E "^lineage-${ve}(-|$)"); do
                      echo "$(gh api "repos/$R/commits/$b" -q .commit.committer.date) $b"
                    done | sort -r | cut -d' ' -f2)
            for b in $CANDS; do
              # Needs SuSFS + every hook + the shared SDM845 configs used by the build
              # (per-device <codename>.config is checked later, in each build matrix leg)
              if usable "$b"; then pick "$b"; exit 0; fi
            done
          done
          echo "::error::No LineageOS branch with SuSFS found in $R"; exit 1

      - name: Decide whether to build
        id: decide
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if [ "${{ steps.ver.outputs.manager }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Manual run (OriginSU $TAG on $BRANCH) -> build"
          echo "build=true" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 2) Build — same steps as Coconutat's build_kernel.sh (option B = dipper)
  #    and same AnyKernel3 packaging; only the root solution differs.
  # ------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All Xiaomi SDM845 devices with a per-device config in the Coconutat tree.
        # beryllium=POCO F1, dipper=Mi 8, equuleus=Mi 8 Pro, polaris=Mi MIX 2S,
        # perseus=Mi MIX 3, ursa=Mi 8 Explorer Edition.
        device: [beryllium, dipper, equuleus, polaris, perseus, ursa]
    env:
      DEVICE: ${{ matrix.device }}
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
      KERNEL_BRANCH: ${{ needs.check.outputs.branch }}
      LINEAGE_VERSION: ${{ needs.check.outputs.lineage }}
      ANDROID_VERSION: ${{ needs.check.outputs.android }}
      ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.root || 'originsu' }}
      KPM: ${{ github.event_name == 'workflow_dispatch' && inputs.kpm || 'false' }}
      # Environment exported by build_kernel.sh
      ARCH: arm64
      SUBARCH: arm64
      CC: clang
      LD: ld.lld
      LLVM: "1"
      LLVM_IAS: "1"
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      CONFIG_BUILD_ARM64_DT_OVERLAY: "y"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex zip curl git wget \
            libssl-dev libelf-dev zstd python3 python-is-python3 cpio unzip \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "https://github.com/${KERNEL_REPO}.git" "$KERNEL_DIR"
          echo "KERNEL_COMMIT=$(git -C "$KERNEL_DIR" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Download AOSP Clang r547379
        run: |
          mkdir -p "$HOME/clang"
          curl -fL --retry 5 --retry-all-errors -o /tmp/clang.tar.gz "$CLANG_URL"
          tar -C "$HOME/clang" -xzf /tmp/clang.tar.gz
          rm -f /tmp/clang.tar.gz
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -n1

      - name: Install the root solution (${{ env.ROOT }})
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # Same as Coconutat's sync_ksu.sh: start from a clean KernelSU folder
          rm -rf KernelSU drivers/kernelsu

          if [ "$ROOT" = "bakasu" ]; then
            # Control build: exactly what Coconutat ships (sync_ksu.sh option E), no change at all
            curl -fLSs https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh | bash
            [ -e drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu missing after setup.sh"; exit 1; }
            exit 0
          fi

          # OriginSU (clone into ./KernelSU + drivers/kernelsu symlink)
          #   samakshkambxj/OriginSU now redirects to KazeSU/KazeSU, whose main branch is KazeSU:
          #   take setup.sh from the OriginSU tag itself and clone the KazeSU URL directly.
          curl -fLSs --retry 3 "https://raw.githubusercontent.com/KazeSU/KazeSU/$ORIGINSU_TAG/kernel/setup.sh" \
            | sed 's|^REPO_URL=.*|REPO_URL="https://github.com/KazeSU/KazeSU"|' \
            | bash -s "$ORIGINSU_TAG"
          [ -e drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu missing after setup.sh"; exit 1; }
          [ "$(git -C KernelSU describe --tags --exact-match 2>/dev/null)" = "$ORIGINSU_TAG" ] \
            || { echo "::error::OriginSU is not at $ORIGINSU_TAG"; git -C KernelSU log -1 --oneline; exit 1; }

          # --- 4.9 compatibility fixes, applied to OriginSU's sources only (kernel tree untouched) ---

          # 1b) Non-GKI fix (older OriginSU versions): include preinit.h unconditionally
          F=KernelSU/kernel/runtime/ksud_integration.c
          if [ -f "$F" ] && grep -q 'ksu_preinit_release' "$F" && \
             ! sed -n '1,/^#if defined(CONFIG_KSU_TRACEPOINT_HOOK)/p' "$F" | grep -q '^#include "preinit/preinit.h"'; then
            sed -i '0,/^#if defined(CONFIG_KSU_TRACEPOINT_HOOK)/s//#include "preinit\/preinit.h" \/\/ fix non-GKI link\n&/' "$F"
            echo "-> preinit.h included unconditionally in $F"
          fi

          # 1c) 4.9 fix: pr_*_ratelimited()/DEFINE_RATELIMIT_STATE need <linux/ratelimit.h>,
          #     which printk.h does not include before 5.x kernels.
          #     Without it: "use of undeclared identifier '_rs'" (e.g. policy/su_request.c).
          grep -rlE '_ratelimited\(|DEFINE_RATELIMIT_STATE|__ratelimit\(' \
               --include='*.c' --include='*.h' KernelSU/kernel | while read -r f; do
            if ! grep -q 'linux/ratelimit.h' "$f"; then
              sed -i '1i #include <linux/ratelimit.h> /* fix 4.9 */' "$f"
              echo "-> linux/ratelimit.h added to $f"
            fi
          done

          # 1d) 4.9 fix: <linux/sched/{signal,task,task_stack,mm,user}.h> only exist since 4.11.
          #     On 4.9 everything they declare is still in <linux/sched.h>.
          #     Without it: "fatal error: 'linux/sched/signal.h' file not found"
          #     (e.g. infra/symbol_resolver.c). Only headers missing from the tree are rewritten.
          grep -rhoE '#[[:space:]]*include[[:space:]]*<linux/sched/[a-z_]+\.h>' \
               --include='*.c' --include='*.h' KernelSU/kernel \
            | sed -E 's/.*<(linux\/sched\/[a-z_]+\.h)>/\1/' | sort -u | while read -r h; do
            if [ ! -e "include/$h" ]; then
              grep -rlE "#[[:space:]]*include[[:space:]]*<${h//\//\\/}>" --include='*.c' --include='*.h' KernelSU/kernel \
                | while read -r f; do
                sed -i -E "s|#([[:space:]]*)include([[:space:]]*)<${h}>|#\1include\2<linux/sched.h> /* fix 4.9: ${h} */|" "$f"
                echo "-> <$h> replaced by <linux/sched.h> in $f"
              done
            fi
          done

          # 1e) 4.9 fix: helpers added after 4.9 that OriginSU calls. Its Kbuild uses
          #     -Wno-implicit-function-declaration, so a missing helper only shows up at link
          #     time ("ld.lld: undefined symbol: kvcalloc / kvmalloc_array / ktime_get_boottime_ns").
          #     A header with fallbacks for the helpers missing from the tree is force-included
          #     into every OriginSU object (nothing is defined if the tree already has it).
          has() { grep -rqE "(static[[:space:]]+(__always_)?inline[^;]*[[:space:]*]$1[[:space:]]*\(|^#[[:space:]]*define[[:space:]]+$1\(|extern[^;]*[[:space:]*]$1[[:space:]]*\()" include/linux; }
          COMPAT="$PWD/KernelSU/kernel/builder_compat_49.h"
          {
            echo '/* Generated by the sdm845 builder: fallbacks for helpers missing from this kernel */'
            echo '#ifndef __BUILDER_COMPAT_49_H'
            echo '#define __BUILDER_COMPAT_49_H'
            echo '#if defined(__KERNEL__) && !defined(__ASSEMBLY__)'
            echo '#include <linux/kernel.h>'
            echo '#include <linux/types.h>'
            echo '#include <linux/gfp.h>'
            echo '#include <linux/mm.h>'
            echo '#include <linux/slab.h>'
            echo '#include <linux/vmalloc.h>'
            echo '#include <linux/ktime.h>'
            echo '#include <linux/timekeeping.h>'
            if ! has kvmalloc; then
              echo 'static inline void *kvmalloc(size_t size, gfp_t flags)'
              echo '{ void *p = kmalloc(size, flags | __GFP_NOWARN | __GFP_NORETRY);'
              echo '  return p ? p : __vmalloc(size, flags | __GFP_HIGHMEM, PAGE_KERNEL); }'
              echo "-> fallback added: kvmalloc" >&2
            fi
            if ! has kvzalloc; then
              echo 'static inline void *kvzalloc(size_t size, gfp_t flags) { return kvmalloc(size, flags | __GFP_ZERO); }'
              echo "-> fallback added: kvzalloc" >&2
            fi
            if ! has kvmalloc_array; then
              echo 'static inline void *kvmalloc_array(size_t n, size_t size, gfp_t flags)'
              echo '{ if (size != 0 && n > SIZE_MAX / size) return NULL; return kvmalloc(n * size, flags); }'
              echo "-> fallback added: kvmalloc_array" >&2
            fi
            if ! has kvcalloc; then
              echo 'static inline void *kvcalloc(size_t n, size_t size, gfp_t flags) { return kvmalloc_array(n, size, flags | __GFP_ZERO); }'
              echo "-> fallback added: kvcalloc" >&2
            fi
            if ! has kmemdup_nul; then
              echo 'static inline char *kmemdup_nul(const char *s, size_t len, gfp_t gfp)'
              echo '{ char *b; if (!s) return NULL; b = kmalloc(len + 1, gfp); if (b) { memcpy(b, s, len); b[len] = 0; } return b; }'
              echo "-> fallback added: kmemdup_nul" >&2
            fi
            # ktime_get_*_ns() were named ktime_get_{boot,real,clocktai}_ns() before 5.3
            for c in boottime:boot real:real clocktai:tai; do
              if ! has "ktime_get_${c%%:*}_ns"; then
                if has "ktime_get_${c#*:}_ns"; then
                  echo "static inline u64 ktime_get_${c%%:*}_ns(void) { return ktime_get_${c#*:}_ns(); }"
                  echo "-> fallback added: ktime_get_${c%%:*}_ns" >&2
                fi
              fi
            done
            echo '#endif'
            echo '#endif'
          } > "$COMPAT"
          echo "ccflags-y += -include $COMPAT" >> KernelSU/kernel/Kbuild
          echo "--- $COMPAT ---"; cat "$COMPAT"

          # The SuSFS inline hooks must be present (OriginSU also checks them at build time)
          for p in "kernel/sys.c:ksu_handle_setresuid" "fs/exec.c:ksu_handle_execveat" \
                   "fs/open.c:ksu_handle_faccessat" "fs/read_write.c:ksu_handle_sys_read" \
                   "fs/stat.c:ksu_handle_stat" "kernel/reboot.c:ksu_handle_sys_reboot" \
                   "drivers/input/input.c:ksu_handle_input_handle_event"; do
            grep -q "${p#*:}" "${p%%:*}" && echo "  hook ok: ${p#*:}" \
              || { echo "::error::hook ${p#*:} missing from ${p%%:*}"; exit 1; }
          done
          [ -f fs/susfs.c ] || { echo "::error::SuSFS missing from the tree"; exit 1; }
          echo "Tree SuSFS: $(grep -m1 SUSFS_VERSION include/linux/susfs.h)"
          sed -i 's/\$(KSU_COMMIT_SHA)-dirty/$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild 2>/dev/null || true

      - name: Generate kernel config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p out
          # Per-device config must exist on this branch for this SDM845 variant
          [ -f "arch/arm64/configs/vendor/xiaomi/${DEVICE}.config" ] \
            || { echo "::error::vendor/xiaomi/${DEVICE}.config missing on ${KERNEL_BRANCH} — skipping ${DEVICE}"; exit 1; }
          # Same command as build_kernel.sh. The tree's extra.config already enables
          # KSU + SuSFS inline hook + all SuSFS features.
          make ARCH=arm64 O=out CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            vendor/xiaomi/mi845_defconfig vendor/xiaomi/extra.config vendor/xiaomi/${DEVICE}.config

          # Only change: KPM, if asked for (manual runs)
          if [ "$KPM" = "true" ]; then
            ./scripts/config --file out/.config -e KPM
            make ARCH=arm64 O=out CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig
          fi

          echo "--- Effective KernelSU configs ---"
          grep -E '^(CONFIG_KSU|CONFIG_KPM)' out/.config || true
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "::error::CONFIG_KSU_SUSFS is not enabled"; exit 1; }

      - name: Extra features — Baseband Guard, NoMount, Droidspaces, TCP BBR
        working-directory: ${{ env.KERNEL_DIR }}
        # Same three features as riarumoda/perf_neon-builder scripts/goodies/*, adapted to this
        # builder (config lives in out/.config, enabled via scripts/config + olddefconfig).
        # Skipped for the "bakasu" control build, which must stay identical to Coconutat's.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MK: make ARCH=arm64 O=out CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1
        run: |
          if [ "$ROOT" = "bakasu" ]; then
            echo "Control (bakasu) build -> extra features skipped"; exit 0
          fi

          ########## 1) Baseband Guard (vc-teahouse) ##########
          echo "== Baseband Guard =="
          BBG_SETUP_URI="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh"
          curl -LSs --fail --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" "$BBG_SETUP_URI" | bash \
            || { echo "::error::Baseband Guard setup failed"; exit 1; }
          ./scripts/config --file out/.config -e BBG
          sed -i 's|^REPO_LINK :=.*|REPO_LINK := https://github.com/vc-teahouse/Baseband-guard|' Baseband-guard/Makefile

          # Register baseband_guard as an LSM only when the kernel has the stacked-LSM list
          # (DEFINE_LSM is >=5.1; on this 4.9 tree the block is simply skipped and BBG uses its
          # own security init instead).
          if grep -q "#define DEFINE_LSM(lsm)" "include/linux/lsm_hooks.h" 2>/dev/null; then
            if grep -q "^CONFIG_LSM=" out/.config; then
              sed -i 's/^\(CONFIG_LSM=".*\)"/\1,baseband_guard"/' out/.config
            else
              echo 'CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"' >> out/.config
            fi
          fi

          # Quirk: drop BBG's duplicate task_security_struct helper when SELinux already defines it
          if grep -q "struct[[:space:]]\+task_security_struct[[:space:]]\+\*selinux_cred" "security/selinux/include/objsec.h" 2>/dev/null; then
            echo "-- removing duplicate task_security_struct definition"
            sed -i '/static inline struct task_security_struct \*selinux_cred/,/[[:space:]]*}/d' security/baseband-guard/tracing/tracing.c
          fi

          ########## 2) NoMount (maxsteeel) ##########
          echo "== NoMount =="
          NOMOUNT_SETUP_URI="https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh"
          NOMOUNT_SETUP_BRANCH="v2.3.0-720"
          curl -LSs --fail --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" "$NOMOUNT_SETUP_URI" | bash -s "$NOMOUNT_SETUP_BRANCH" \
            || { echo "::error::NoMount setup failed"; exit 1; }
          ./scripts/config --file out/.config -e NOMOUNT
          # OriginSU v4.3.0 drives NoMount itself (OriginMount screen -> "nomount" mode): ksud
          # probes the built-in driver first and needs driver API >= 22 (NoMount v2.2.0+). v2.3.0
          # reports API 23 with the same wire structures. Do not install the NoMount module zip on top.
          NM_API="$(sed -n 's/^#define NOMOUNT_BASE_VERSION "\([0-9]*\)".*/\1/p' fs/nomount/nomount.h)"
          echo "-- NoMount driver API: ${NM_API:-unknown}"
          [ -n "$NM_API" ] && [ "$NM_API" -ge 22 ] \
            || { echo "::error::NoMount API ${NM_API:-unknown} < 22: OriginSU v4.3.0 would refuse the driver"; exit 1; }

          ########## 3) Droidspaces (ravindu644) ##########
          echo "== Droidspaces =="
          DROIDSPACES_XT_QTAGUID="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch"
          DROIDSPACES_CGROUP="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          # Droidspaces only ships non-GKI patches for kernel/cgroup/cgroup.c, which exists
          # only since 4.15. On this 4.9 tree the very same function (cgroup_add_file) and the
          # symbols the hunk uses (CGRP_ROOT_NOPREFIX, CFTYPE_NO_PREFIX, kernfs_create_link) live
          # in kernel/cgroup.c. So: try the patch as-is (works on newer trees), and if it does
          # not apply, retry with the path rewritten to the 4.9 location. Verified to apply
          # cleanly on Coconutat 4.9. '-t' keeps patch non-interactive (never prompts).
          apply_ds_patch() {
            local url="$1" desc="$2" f a
            f="$(mktemp)"; a="$(mktemp)"
            wget -qO "$f" "$url" || { echo "::warning::Droidspaces: could not download ${desc}"; rm -f "$f" "$a"; return 0; }
            if patch -p1 --fuzz=5 -t --dry-run < "$f" >/dev/null 2>&1; then
              patch -p1 --fuzz=5 -t < "$f" >/dev/null && echo "-- Droidspaces: applied ${desc}"
            else
              # 4.9 fallback: kernel/cgroup/cgroup.c -> kernel/cgroup.c
              sed 's#kernel/cgroup/cgroup\.c#kernel/cgroup.c#g' "$f" > "$a"
              if ! cmp -s "$f" "$a" && patch -p1 --fuzz=5 -t --dry-run < "$a" >/dev/null 2>&1; then
                patch -p1 --fuzz=5 -t < "$a" >/dev/null && echo "-- Droidspaces: applied ${desc} (4.9 path)"
              else
                echo "::warning::Droidspaces: ${desc} does not apply on this kernel — skipped (configs still enabled)"
              fi
            fi
            rm -f "$f" "$a"
          }
          [ -f "net/netfilter/xt_qtaguid.c" ] && apply_ds_patch "$DROIDSPACES_XT_QTAGUID" "xt_qtaguid panic fix"
          apply_ds_patch "$DROIDSPACES_CGROUP" "cgroup prefix fix"

          ########## 4) TCP BBR + fq as default qdisc ##########
          # On 4.9, BBR has no internal pacing (added in 4.13): tcp_bbr.c says it *must* run on
          # the fq qdisc, otherwise it does not work properly. This tree has no Kconfig option to
          # pick the default qdisc (NET_SCH_DEFAULT, upstream since 4.13), so it stays pfifo_fast.
          # Backport that small upstream change: the Kconfig choice + a late_initcall calling
          # qdisc_set_default(), which already exists here (net.core.default_qdisc sysctl).
          echo "== TCP BBR + fq =="
          if grep -q '^menuconfig NET_SCH_DEFAULT' net/sched/Kconfig; then
            echo "-- NET_SCH_DEFAULT already in the tree"
          else
            grep -q '^int qdisc_set_default(const char \*name)' net/sched/sch_api.c \
              || { echo "::error::qdisc_set_default() not found in net/sched/sch_api.c"; exit 1; }
            python3 - <<'PY'
          kc = "net/sched/Kconfig"
          s = open(kc).read()
          anchor = 'comment "Classification"\n'
          assert s.count(anchor) == 1, "Kconfig anchor not found"
          block = """menuconfig NET_SCH_DEFAULT
          	bool "Allow override default queue discipline"
          	help
          	  Support for selection of default queuing discipline.

          	  Nearly all users can safely say no here, and the default
          	  of pfifo_fast will be used. Many distributions already set
          	  the default value via /proc/sys/net/core/default_qdisc.

          	  If unsure, say N.

          if NET_SCH_DEFAULT

          choice
          	prompt "Default queuing discipline"
          	default DEFAULT_PFIFO_FAST
          	help
          	  Select the queueing discipline that will be used by default
          	  for all network devices.

          	config DEFAULT_FQ
          		bool "Fair Queue" if NET_SCH_FQ

          	config DEFAULT_CODEL
          		bool "Controlled Delay" if NET_SCH_CODEL

          	config DEFAULT_FQ_CODEL
          		bool "Fair Queue Controlled Delay" if NET_SCH_FQ_CODEL

          	config DEFAULT_SFQ
          		bool "Stochastic Fair Queue" if NET_SCH_SFQ

          	config DEFAULT_PFIFO_FAST
          		bool "Priority FIFO Fast"
          endchoice

          config DEFAULT_NET_SCH
          	string
          	default "pfifo_fast" if DEFAULT_PFIFO_FAST
          	default "fq" if DEFAULT_FQ
          	default "fq_codel" if DEFAULT_FQ_CODEL
          	default "sfq" if DEFAULT_SFQ
          	default "pfifo_fast"
          endif

          """
          open(kc, "w").write(s.replace(anchor, block + anchor, 1))

          api = "net/sched/sch_api.c"
          s = open(api).read()
          anchor = "subsys_initcall(pktsched_init);\n"
          assert s.count(anchor) == 1, "pktsched_init anchor not found"
          s = s.replace(anchor, anchor + """
          #ifdef CONFIG_NET_SCH_DEFAULT
          static int __init sch_default_qdisc(void)
          {
          	return qdisc_set_default(CONFIG_DEFAULT_NET_SCH);
          }
          late_initcall(sch_default_qdisc);
          #endif
          """, 1)
          open(api, "w").write(s)
          print("-- NET_SCH_DEFAULT backported (Kconfig + late_initcall)")
          PY
          fi

          ########## 5) Optimizations (low risk, missing from the Coconutat config) ##########
          echo "== Optimizations =="
          # 5a) vm.swappiness up to 200 (4.9 caps it at 100). The reclaim math already uses
          #     file_prio = 200 - anon_prio, so 200 is valid: it lets userspace prefer swapping
          #     to ZRAM over dropping file cache. The value set by the ROM (100) is unchanged.
          if grep -q 'static int two_hundred = 200;' kernel/sysctl.c; then
            echo "-- swappiness: already patched"
          elif grep -q 'file_prio = 200 - anon_prio;' mm/vmscan.c \
               && awk '/\.procname[[:space:]]*=[[:space:]]*"swappiness"/{f=1} f&&/\.extra2/{print; exit}' kernel/sysctl.c | grep -q '&one_hundred'; then
            sed -i 's/^static int one_hundred = 100;$/&\nstatic int two_hundred = 200;/' kernel/sysctl.c
            sed -i '/\.procname[[:space:]]*=[[:space:]]*"swappiness"/,/}/ s/\.extra2\([[:space:]]*\)=[[:space:]]*&one_hundred/.extra2\1= \&two_hundred/' kernel/sysctl.c
            awk '/\.procname[[:space:]]*=[[:space:]]*"swappiness"/{f=1} f&&/\.extra2/{print; exit}' kernel/sysctl.c | grep -q '&two_hundred' \
              && echo "-- swappiness max = 200" || { echo "::error::swappiness patch did not apply"; exit 1; }
          else
            echo "::warning::swappiness patch skipped (kernel/sysctl.c or mm/vmscan.c changed upstream)"
          fi
          # 5a') Same limit for memory cgroups: LineageOS' init.qcom.rc writes 140 to
          #      /sys/fs/cgroup/memory/bg/memory.swappiness (background apps swap to ZRAM sooner),
          #      but this 4.9 kernel rejects values above 100, so the ROM's setting never applied.
          #      Per-memcg reclaim uses the same file_prio = 200 - anon_prio math as the global one.
          if awk '/^static int mem_cgroup_swappiness_write/{f=1} f&&/if \(val > 200\)/{print; exit}' mm/memcontrol.c | grep -q .; then
            echo "-- memcg swappiness: already patched"
          elif awk '/^static int mem_cgroup_swappiness_write/{f=1} f&&/if \(val > 100\)/{print; exit}' mm/memcontrol.c | grep -q .; then
            sed -i '/^static int mem_cgroup_swappiness_write/,/^}/ s/if (val > 100)/if (val > 200)/' mm/memcontrol.c
            awk '/^static int mem_cgroup_swappiness_write/{f=1} f&&/if \(val > 200\)/{print; exit}' mm/memcontrol.c | grep -q . \
              && echo "-- memcg swappiness max = 200" || { echo "::error::memcg swappiness patch did not apply"; exit 1; }
          else
            echo "::warning::memcg swappiness patch skipped (mm/memcontrol.c changed upstream)"
          fi
          # 5b) Tune code generation for the cores (4x Cortex-A75 + 4x Cortex-A55, all ARMv8.2).
          #     Clang has no big.LITTLE -mcpu pair: tune for the A55 like most SDM845 kernels.
          if grep -q -- '-mcpu=' Makefile arch/arm64/Makefile; then
            echo "-- -mcpu already set"
          else
            sed -i '0,/export KBUILD_CFLAGS/s//KBUILD_CFLAGS += -mcpu=cortex-a55\n&/' Makefile
            grep -q -- '-mcpu=cortex-a55' Makefile && echo "-- KBUILD_CFLAGS += -mcpu=cortex-a55" \
              || { echo "::error::-mcpu patch did not apply"; exit 1; }
          fi
          # 5c) ZRAM: lz4 instead of lzo by default. The ROM never sets comp_algorithm, so the
          #     kernel default applies, and on this 4.9 tree it is hard-coded to "lzo". lz4 is much
          #     faster (above all to read pages back from ZRAM) for a slightly lower ratio, which
          #     does not matter with 6-8 GB of RAM. zstd stays available. CONFIG_CRYPTO_LZ4 is
          #     enabled below and checked in the final config: without it zram could not start.
          if grep -q '^static const char \*default_compressor = "lz4";' drivers/block/zram/zram_drv.c; then
            echo "-- zram: lz4 already the default"
          elif grep -q '^static const char \*default_compressor = "lzo";' drivers/block/zram/zram_drv.c; then
            sed -i 's/^static const char \*default_compressor = "lzo";/static const char *default_compressor = "lz4";/' drivers/block/zram/zram_drv.c
            echo "-- zram: default compressor lzo -> lz4"
          else
            echo "::error::zram default_compressor not found in drivers/block/zram/zram_drv.c"; exit 1
          fi
          # 5d) Configs: power-efficient workqueues, lz4 (default, see 5c) + zstd for ZRAM,
          #     TTL / HL targets for tethering (appended below with the other configs).

          cat >> out/.config <<'EOF'
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_NETFILTER_XT_TARGET_HL=y
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NF_CONNTRACK_IPV6=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_MACVLAN=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          CONFIG_USER_NS=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_HL=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NETFILTER_XT_TARGET_NFLOG=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          EOF
          sed -i 's/^[[:space:]]*CONFIG_/CONFIG_/' out/.config

          # Re-resolve everything (new BBG/NoMount Kconfig symbols + appended values)
          $MK olddefconfig

          echo "--- Extra-feature configs effectively enabled ---"
          grep -E '^CONFIG_(BBG|NOMOUNT|NAMESPACES|USER_NS|OVERLAY_FS|TCP_CONG_BBR|DEFAULT_BBR|NET_SCH_FQ|NET_SCH_DEFAULT|DEFAULT_FQ)=|^CONFIG_DEFAULT_(TCP_CONG|NET_SCH)=' out/.config || true
          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config || { echo "::error::TCP BBR is not the default congestion control"; exit 1; }
          grep -q '^CONFIG_DEFAULT_NET_SCH="fq"' out/.config  || { echo "::error::fq is not the default qdisc (BBR needs fq pacing on 4.9)"; exit 1; }
          echo "--- Optimizations ---"
          # (CONFIG_CFS_BANDWIDTH, asked for by Droidspaces above, cannot stick on this tree: it
          #  depends on !SCHED_WALT and Qualcomm's WALT scheduler is on. Droidspaces' --cpus limit is
          #  therefore unavailable here; memory/swap limits (MEMCG) work.)
          for k in CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y CONFIG_CRYPTO_LZ4=y CONFIG_CRYPTO_ZSTD=y CONFIG_IP_NF_TARGET_TTL=y CONFIG_IP6_NF_TARGET_HL=y CONFIG_MEMCG=y; do
            grep -qxF "$k" out/.config && echo "  $k" || { echo "::error::$k missing from the final config"; exit 1; }
          done

      - name: Compile the kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set +e
          # Same command as build_kernel.sh
          make ARCH=arm64 O=out CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 -j"$(nproc --all)" 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e

          echo "--- KernelSU messages ---"
          grep -E -- '-- (OriginSU|BakaSU|KernelSU|KPM|SUSFS|You )' build.log | sort -u || true
          echo "--- Contents of out/arch/arm64/boot ---"
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "(directory missing)"

          if [ "$RC" -ne 0 ]; then
            echo "::error::Build failed (make exit code $RC). First errors:"
            grep -nE "error:|Error [0-9]|undefined reference|\*\*\*" build.log | head -n 40 || true
            exit "$RC"
          fi
          for f in Image.gz Image.gz-dtb; do
            [ -f "out/arch/arm64/boot/$f" ] || { echo "::error::Build succeeded but no $f was produced."; exit 1; }
          done

      - name: Upload build log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.device }}-${{ env.ROOT }}
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
          if-no-files-found: ignore

      - name: Package with AnyKernel3 (same as Coconutat)
        run: |
          # Same as sync_anykernel3.sh + build_kernel.sh: osm0sis AnyKernel3 + the tree's
          # tools/AnyKernel3_sh/anykernel.sh, with BOTH Image.gz and Image.gz-dtb.
          # AnyKernel3 flashes the first one it finds, i.e. Image.gz, and keeps the DTB
          # already in the ROM's boot.img. Flashing our Image.gz-dtb instead replaced
          # that DTB, and the bootloader dropped to fastboot.
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image.gz"     AnyKernel3/Image.gz
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb" AnyKernel3/Image.gz-dtb
          cp -f "$KERNEL_DIR/tools/AnyKernel3_sh/anykernel.sh" AnyKernel3/anykernel.sh

          # Only changes to Coconutat's anykernel.sh: restrict to the matrix device
          # (this build uses <device>.config) and set the kernel name
          AK=AnyKernel3/anykernel.sh
          case "$DEVICE" in
            beryllium) MODEL="POCO F1";;
            dipper)    MODEL="Mi 8";;
            equuleus)  MODEL="Mi 8 Pro";;
            polaris)   MODEL="Mi MIX 2S";;
            perseus)   MODEL="Mi MIX 3";;
            ursa)      MODEL="Mi 8 Explorer Edition";;
            *)         MODEL="$DEVICE";;
          esac
          sed -i -E '/^device\.name[0-9]+=/d' "$AK"
          sed -i -E "s/^do\.devicecheck=.*/&\ndevice.name1=${DEVICE}/" "$AK"
          if [ "$ROOT" = "bakasu" ]; then NAME="BakaSU (control build)"; else NAME="OriginSU ${ORIGINSU_TAG}"; fi
          sed -i -E "s|^kernel\.string=.*|kernel.string=Xiaomi ${MODEL} (${DEVICE}) LineageOS ${LINEAGE_VERSION} kernel with ${NAME} + SuSFS - based on the Coconutat SDM845 kernel|" "$AK"
          # (no single quote allowed in kernel.string: it sits inside properties() { ' ... ' })
          [ "$(grep -c "'" "$AK")" = "$(grep -c "'" "$KERNEL_DIR/tools/AnyKernel3_sh/anykernel.sh")" ] \
            || { echo "::error::anykernel.sh quoting broken"; exit 1; }
          echo "--- anykernel.sh ---"; sed -n '1,40p' "$AK"
          grep -q "^device.name1=${DEVICE}$" "$AK" || { echo "::error::anykernel.sh: device check not set"; exit 1; }

          KREL=$(cat "$KERNEL_DIR/out/include/config/kernel.release" 2>/dev/null)
          if [ "$ROOT" = "bakasu" ]; then SU=BakaSU-control; else SU="OriginSU-${ORIGINSU_TAG}"; fi
          ZIP="sdm845-${DEVICE}-LOS${LINEAGE_VERSION}-${SU}-susfs-$(date +%Y%m%d).zip"
          (cd AnyKernel3 && zip -rq9 "../$ZIP" ./*)
          mkdir -p dist
          mv "$ZIP" dist/
          cp "$KERNEL_DIR/out/.config" dist/config-${DEVICE}.txt
          cp "$KERNEL_DIR/build.log"   dist/build-${DEVICE}.log
          echo "KERNEL_COMMIT=$KERNEL_COMMIT" > dist/info-${DEVICE}.txt
          echo "KERNEL_RELEASE=$KREL" >> dist/info-${DEVICE}.txt
          echo "SUSFS_VERSION=$(grep -m1 SUSFS_VERSION "$KERNEL_DIR/include/linux/susfs.h" | cut -d'"' -f2)" >> dist/info-${DEVICE}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdm845-${{ matrix.device }}-${{ env.ROOT }}
          path: dist/*

  # ------------------------------------------------------------------
  # 3) Publish the GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [check, build]
    if: >-
      needs.check.outputs.build == 'true' && needs.build.result == 'success' &&
      inputs.publish && inputs.root != 'bakasu'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: originsu-${{ needs.check.outputs.tag }}
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
      KERNEL_BRANCH: ${{ needs.check.outputs.branch }}
      LINEAGE_VERSION: ${{ needs.check.outputs.lineage }}
      ANDROID_VERSION: ${{ needs.check.outputs.android }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sdm845-*-originsu
          merge-multiple: true
          path: dist

      - name: Fetch the OriginSU manager APK
        # Same tag as the kernel (KazeSU/KazeSU release "legacy-<tag>"); arm64-v8a only.
        run: |
          gh release download "$ORIGINSU_TAG" --repo KazeSU/KazeSU \
            --pattern 'OriginSU_*-arm64-v8a-release.apk' --dir dist
          APK="$(ls dist/OriginSU_*-arm64-v8a-release.apk 2>/dev/null | head -n1)"
          [ -n "$APK" ] || { echo "::error::OriginSU manager APK not found in KazeSU/KazeSU release $ORIGINSU_TAG"; exit 1; }
          echo "MANAGER_APK=$(basename "$APK")" >> "$GITHUB_ENV"
          echo "-> $(basename "$APK") ($(du -h "$APK" | cut -f1))"

      - name: Write release notes
        run: |
          source "$(ls dist/info-*.txt | head -1)"
          # One "download" row per device zip that was actually produced
          DEVROWS=""
          for z in $(ls dist/*.zip | sort); do
            b=$(basename "$z")
            dev=$(echo "$b" | sed -nE 's/^sdm845-([a-z0-9]+)-.*/\1/p')
            case "$dev" in
              beryllium) m="POCO F1";;
              dipper)    m="Mi 8";;
              equuleus)  m="Mi 8 Pro";;
              polaris)   m="Mi MIX 2S";;
              perseus)   m="Mi MIX 3";;
              ursa)      m="Mi 8 Explorer Edition";;
              *)         m="$dev";;
            esac
            DEVROWS="${DEVROWS}| ${m} | \`${dev}\` | \`${b}\` |"$'\n'
          done
          cat > notes.md <<EOF
          ## Xiaomi SDM845 kernels — OriginSU \`${ORIGINSU_TAG}\`

          | | |
          |---|---|
          | OriginSU | [${ORIGINSU_TAG}](https://github.com/KazeSU/KazeSU/releases/tag/${ORIGINSU_TAG}) (final OriginSU release, kernel + manager, now hosted by KazeSU as "legacy-${ORIGINSU_TAG}") |
          | ROM | LineageOS ${LINEAGE_VERSION} (Android ${ANDROID_VERSION}) and /e/OS based on it |
          | Kernel | Coconutat SDM845 \`${KERNEL_BRANCH}\` @ [\`${KERNEL_COMMIT}\`](https://github.com/${KERNEL_REPO}/commit/${KERNEL_COMMIT}) |
          | Kernel version | \`${KERNEL_RELEASE}\` |
          | SuSFS | \`${SUSFS_VERSION}\` (inline hook) |
          | Extra features | Baseband Guard · NoMount · Droidspaces (with memory limits) · TCP BBR + fq (default) |
          | Optimizations | ZRAM in lz4 by default (was lzo; zstd available) · power-efficient workqueues · TTL/HL targets · \`vm.swappiness\` and per-cgroup swappiness up to 200 (the ROM's 140 for background apps now applies) · Cortex-A55 tuning |
          | Manager | \`${MANAGER_APK}\` (attached) |
          | Build date | $(date -u +%Y-%m-%d) |

          ### Which zip for my device?
          Flash **only** the zip whose codename matches your device:

          | Device | Codename | Zip |
          |---|---|---|
          ${DEVROWS}
          > ⚠️ **Not fully tested.** These per-device builds are produced automatically. The
          > maintainer tests on **beryllium (POCO F1)**, **dipper (Mi 8)** and **polaris (Mi MIX 2S)**;
          > the other variants are untested — back up your stock \`boot\` and test before daily use.

          Flash from TWRP / OrangeFox, then install the attached **OriginSU manager**
          (\`${MANAGER_APK}\`, same version as the kernel — not the KazeSU v1.x manager).
          **Back up your stock \`boot\` partition first.**

          ### Modules — pick a mount mode
          OriginSU mounts modules itself: open the manager's **OriginMount** screen and pick a mode.
          In \`auto\` (default) nothing is mounted unless a metamodule is installed or Magic Mount is enabled.
          **NoMount** is built into this kernel (no real mounts, nothing in \`/proc/mounts\`): choose \`nomount\`
          and do not install the separate NoMount module zip.

          > **Why OriginSU and not KazeSU?** KazeSU v1.x does not build on this Linux 4.9 kernel (its SELinux
          > code needs 5.10+), and 4.9 is the newest kernel LineageOS ships for SDM845. OriginSU \`${ORIGINSU_TAG}\`
          > stays the recommended root here.
          EOF
          sed -i 's/^          //' notes.md

      - name: Create (or replace) the release
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Xiaomi SDM845 LineageOS ${LINEAGE_VERSION} — OriginSU ${ORIGINSU_TAG}" \
            --notes-file notes.md --latest \
            dist/*.zip dist/config-*.txt dist/*.apk
